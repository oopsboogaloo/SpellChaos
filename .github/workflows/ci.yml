name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node tools/run-turn.mjs
      - run: node tools/run-combat.mjs
      - run: node tools/run-casting.mjs
      - run: node tools/run-reanimation.mjs
      - run: node tools/run-swarms.mjs
      - run: node tools/run-illusions.mjs
      - run: node tools/run-darkness.mjs
      - run: node tools/run-tangleweed.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
